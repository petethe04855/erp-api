name: Go Backend CI & Security Scan

on:
  push:
    branches:
      - main
      - dev
      - 'dev/**'        # ครอบคลุมทุกกิ่งที่ขึ้นต้นด้วย dev/ เช่น dev/stock-fix
  pull_request:
    branches:
      - main
      - dev

jobs:
  test-and-scan:
    name: Test, Security Scan & Build
    runs-on: ubuntu-latest

    steps:
      # 1. ดึงโค้ดจาก Repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. ติดตั้ง Go โดยอ่านเวอร์ชันจาก go.mod พร้อมเปิด Cache
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      # 3. ดาวน์โหลด Dependencies ทั้งหมด
      - name: Download Go Modules
        run: go mod download

      # 4. รัน Unit Test ทุกตัวในโปรเจกต์
      - name: Run Unit Tests
        run: go test -v -count=1 ./...

      # 5. สแกนหาช่องโหว่ความปลอดภัยของ Third-party Package (Vulnerability Scan)
      - name: Run Security Scan (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      # 6. ตรวจสอบว่าโค้ดคอมไพล์ผ่านจริงบน Linux
      - name: Verify Go Build
        run: go build -v -o api ./cmd/api
