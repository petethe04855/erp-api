name: Go Backend CI & Security Scan

on:
  push:
    branches:
      - main
      - dev
      - 'dev/**'
  pull_request:
    branches:
      - main
      - dev

# least-privilege: read-only is enough for this pipeline
permissions:
  contents: read

defaults:
  run:
    working-directory: erp-api-v2 # Go module lives here, not at repo root

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-scan:
    name: Test, Security Scan & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # สำคัญ: จำเป็นสำหรับ Gitleaks เพื่อสแกนประวัติ commit ย้อนหลัง

      # ---------------------------------------------
      # สแกนตรวจจับ Secret / Token / .env หลุด (runs at repo root, covers all modules)
      # ---------------------------------------------
      - name: Secret Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'erp-api-v2/go.mod'
          cache: true

      - name: Download Go Modules
        run: go mod download

      - name: Run Unit Tests
        run: go test -v -count=1 ./...

      - name: Run Vulnerability Scan (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

      - name: Verify Go Build
        run: go build -v -o api ./cmd/api

  # ---------------------------------------------
  # แจ้งผลผ่าน Discord webhook เมื่อ pipeline จบ (ทั้ง success และ fail)
  # ตั้ง secret DISCORD_WEBHOOK_URL ใน repo ก่อน (Settings → Secrets → Actions)
  # ---------------------------------------------
  notify-discord:
    name: Notify Discord
    needs: [test-and-scan]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: read
    steps:
      - name: Send result to Discord
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          JOB_RESULT: ${{ needs.test-and-scan.result }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL not set - skipping notification"
            exit 0
          fi

          case "$JOB_RESULT" in
            success)
              TITLE="✅ Go Backend CI ผ่าน (Test, Security Scan & Build)"
              COLOR=3066993 ;;
            *)
              TITLE="❌ Go Backend CI ไม่ผ่าน (Test, Security Scan & Build)"
              COLOR=15158332 ;;
          esac

          RUN_URL="$GITHUB_SERVER_URL/$REPO/actions/runs/$RUN_ID"
          SHA_SHORT="${SHA:0:7}"

          jq -n --arg title "$TITLE" --arg color "$COLOR" \
                --arg fields "**Branch:** $BRANCH
**Commit:** $SHA_SHORT - $COMMIT_MSG
**Triggered by:** $ACTOR
**Result:** $JOB_RESULT" \
                --arg url "$RUN_URL" \
                '{embeds: [{title: $title, description: ($fields), color: ($color|tonumber), url: $url}]}' \
                > payload.json

          curl -sS -X POST -H "Content-Type: application/json" \
               --data @payload.json "$WEBHOOK_URL"

