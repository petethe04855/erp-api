name: Go Backend CI & Security Scan

on:
  push:
    branches:
      - main
      - dev
      - 'dev/**'
  pull_request:
    branches:
      - main
      - dev

jobs:
  test-and-scan:
    name: Test, Security Scan & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # สำคัญ: จำเป็นสำหรับ Gitleaks เพื่อสแกนประวัติ commit ย้อนหลัง

      # ---------------------------------------------
      # สแกนตรวจจับ Secret / Token / .env หลุด
      # ---------------------------------------------
      - name: Secret Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Download Go Modules
        run: go mod download

      - name: Run Unit Tests
        run: go test -v -count=1 ./...

      - name: Run Vulnerability Scan (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Verify Go Build
        run: go build -v -o api ./cmd/api
